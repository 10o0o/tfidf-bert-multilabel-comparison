[project]
name = "tfidf-bert-multilabel-comparison"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
    "transformers>=5.19.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
